# etip_frontend — static SPA server (sits behind etip_nginx)
#
# Known client-side routes get index.html with 200. Every one of them is a private or
# auth page, so they also get "X-Robots-Tag: noindex". Anything else that is not a real
# file returns a true 404 (with the SPA shell as the body, so NotFoundPage still renders).
# Keep this list in sync with apps/frontend/src/App.tsx. Public marketing pages must be
# real files in dist/ (prerendered), not entries here.
map $request_uri $spa_route {
  default 0;
  "~^/(login|register|auth|onboard|dashboard|iocs|threat-actors|malware|vulnerabilities|graph|hunting|drp|correlation|search|command-center|global-catalog|feeds|integrations|settings|customization|billing|admin|onboarding|reporting|alerting|analytics|plan-limits|global-monitoring|enrichment|global-ai-config)(/|\?|$)" 1;
}

map $spa_route $robots_tag {
  0 "";
  1 "noindex, nofollow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /index.html;

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $robots_tag always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html @spa;
  }

  location @spa {
    if ($spa_route) {
      rewrite ^ /index.html last;
    }
    return 404;
  }
}
