        proxy_send_timeout 30s;
    }

    # ── S147 / DECISION-031: sales-led plan changes ─────────────────
    # api-gateway POST /api/v1/billing/upgrade sets Tenant.plan + subscription in one
    # transaction and invalidates the plan cache. Super admin only (rbac org:read); the
    # target tenant is chosen with x-tenant-id (I-08). Exact match beats the prefix below.
    # S147: the api-gateway owns these (plan-backed limits for FeatureGate; the tenant's
    # real current plan). billing-service has neither path. Gateway authenticates itself.
    location ~ ^/api/v1/billing/(limits|subscription)$ {
        proxy_pass http://etip_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # S147: es-indexing POST /reindex takes tenantId from the request BODY, so any logged-in
    # user could write documents into another tenant's search index. Super admin only.
    location = /api/v1/search/reindex {
        include /etc/nginx/conf.d/service-auth-super-admin.inc;
        proxy_pass http://etip_es_indexing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
