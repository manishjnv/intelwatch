    # ── S147: auth_request targets (internal only) ───────────────
    # Validate the caller's access JWT at the api-gateway; see service-auth*.inc.
    location = /_etip_auth {
        internal;
        proxy_pass http://etip_api_backend/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /_etip_auth_super_admin {
        internal;
        proxy_pass http://etip_api_backend/api/v1/auth/verify/super-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── S147: api-gateway features under /api/v1/admin ──────────────
    # These routes live in the api-gateway (which authenticates + RBACs them itself); the
    # /api/v1/admin prefix below would otherwise send them to admin-service (404).
    location ~ ^/api/v1/admin/((access-reviews|break-glass|compliance|mfa|offboarding|retention|plans|users)|tenants/[^/]+/(overrides|offboard|offboard-status|cancel-offboard))(/|$) {
        proxy_pass http://etip_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── S147: Razorpay webhook stays public (HMAC signature verified in billing-service) ─
    location /api/v1/billing/webhooks/ {
        proxy_pass http://etip_billing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
