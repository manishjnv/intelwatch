# Non-page endpoints must never be indexed. App/auth page routes get the same header
# from the etip_frontend container (apps/frontend/nginx.conf).
map $request_uri $etip_robots_tag {
    default "";
    "~^/(api|grafana|health|ready|ws)(/|\?|$)" "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    # ── Security headers (no location below sets add_header, so these are inherited) ──
    # TLS terminates at Cloudflare; HSTS is still honoured by browsers on the https origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $etip_robots_tag always;

    # ── API Gateway proxy ──────────────────────────────────────────
    location /health {
        proxy_pass http://etip_api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /ready {
        proxy_pass http://etip_api_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Ingestion Service — feed management routes ─────────────
    location /api/v1/feeds {
        include /etc/nginx/conf.d/service-auth.inc;
        proxy_pass http://etip_ingestion_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Ingestion Service — article routes ──────────────────
    location /api/v1/articles {
        include /etc/nginx/conf.d/service-auth.inc;
