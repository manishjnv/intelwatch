# ═══════════════════════════════════════════════════════════════
# ETIP VPS Command Runner
# Uses Cloudflare Tunnel (ssh.intelwatch.in) for reliable SSH.
# No more port 22 filtering timeouts.
#
# Usage: gh workflow run vps-cmd.yml -f cmd="docker ps"
# ═══════════════════════════════════════════════════════════════

name: VPS Command

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Shell command to run on VPS (runs as root in /opt/intelwatch)'
        required: true
        type: string

jobs:
  run:
    name: Run on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.intelwatch.in
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
          EOF

          # ssh_retry: retries ONLY on ssh exit 255 (dropped tunnel — "websocket: bad
          # handshake", "Broken pipe"), 3 attempts total, sleeps 10s then 20s between.
          # Any other exit code returns immediately.
          # Callers needing stdin set SSH_STDIN=<file> so every attempt re-reads it.
          # `&& rc=0 || rc=$?` keeps a 255 from tripping the runner's `bash -e`.
          cat > ~/ssh_retry.sh << 'HELPER'
          ssh_retry() {
            local attempt=1 max=3 rc sleep_s
            while true; do
              if [ -n "${SSH_STDIN:-}" ]; then
                ssh "$@" < "$SSH_STDIN" && rc=0 || rc=$?
              else
                ssh "$@" && rc=0 || rc=$?
              fi
              if [ "$rc" -ne 255 ] || [ "$attempt" -ge "$max" ]; then
                return "$rc"
              fi
              sleep_s=$((attempt * 10))
              echo "ssh attempt $attempt failed (255), retrying in ${sleep_s}s..." >&2
              sleep "$sleep_s"
              attempt=$((attempt + 1))
            done
          }
          HELPER

      - name: Execute command on VPS
        timeout-minutes: 5
        run: |
          source ~/ssh_retry.sh
          cat > "$RUNNER_TEMP/remote.sh" << 'REMOTE'
          set -e
          cd /opt/intelwatch
          echo "━━━ VPS Command Runner ━━━"
          echo "Time: $(date -u)"
          echo "Cmd: ${{ inputs.cmd }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          ${{ inputs.cmd }}
          echo ""
          echo "━━━ Done ━━━"
          REMOTE
          SSH_STDIN="$RUNNER_TEMP/remote.sh" ssh_retry ssh.intelwatch.in bash -s
