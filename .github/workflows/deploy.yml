# ═══════════════════════════════════════════════════════════════
# ETIP CI/CD Pipeline
# Triggers: push to master (after PR merge)
# Jobs: test → deploy to VPS
# SAFETY: Only touches etip_ containers on VPS
# ═══════════════════════════════════════════════════════════════

name: ETIP CI/CD

on:
  push:
    branches: [master]
    # STEP_00B U10: docs-only merges don't redeploy (the S148 outage started from one)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

# STEP_00B U10: never run two deploys at once (older code could win the :latest race)
concurrency:
  group: etip-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ─── Test ─────────────────────────────────────────────────
  test:
    name: Test, Type-check, Lint & Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # v4 reads pnpm version from package.json "packageManager" field automatically
      # NEVER set 'version' param — conflicts with packageManager (RCA Issue #1)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema=prisma/schema.prisma

      - name: Build (tsc -b — strict dependency order, generates .d.ts for cross-package imports)
        run: pnpm exec tsc -b tsconfig.build.json

      - name: Run tests (after build — shared packages must be compiled first, RCA #37)
        run: pnpm -r test

      - name: Typecheck + Lint + Audit (parallel — these are independent of each other)
        run: |
          pnpm --filter '!@etip/frontend' -r run typecheck &
          PID_TC=$!
          pnpm -r run lint &
          PID_LINT=$!
          pnpm audit --audit-level=high &
          PID_AUDIT=$!

          # Wait for typecheck and lint (must pass), audit is non-blocking
          wait $PID_TC || exit 1
          wait $PID_LINT || exit 1
          wait $PID_AUDIT || true

  # ─── Build Docker images in CI (not on VPS) ────────────────
  build-images:
    name: Build & Push Docker Images
    needs: [test]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          DOCKER_BUILDKIT=1 docker build -t ghcr.io/${{ github.repository_owner }}/etip-backend:latest -f Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/etip-backend:latest

      - name: Build and push frontend image
        run: |
          DOCKER_BUILDKIT=1 docker build -t ghcr.io/${{ github.repository_owner }}/etip-frontend:latest -f Dockerfile.frontend .
          docker push ghcr.io/${{ github.repository_owner }}/etip-frontend:latest

  # ─── Deploy (VPS pulls pre-built images — no build on VPS) ──
  deploy:
    name: Deploy to VPS
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      always() &&
      needs.build-images.result == 'success'
    steps:
      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH via Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config << EOF
          Host vps
            HostName ssh.intelwatch.in
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
          EOF

          # ssh_retry: retries ONLY on ssh exit 255 (dropped tunnel — "websocket: bad
          # handshake", "Broken pipe"), 3 attempts total, sleeps 10s then 20s between.
          # Any other exit code returns immediately.
          # Callers needing stdin set SSH_STDIN=<file> so every attempt re-reads it.
          # `&& rc=0 || rc=$?` keeps a 255 from tripping the runner's `bash -e`.
          cat > ~/ssh_retry.sh << 'HELPER'
          ssh_retry() {
            local attempt=1 max=3 rc sleep_s
            while true; do
              if [ -n "${SSH_STDIN:-}" ]; then
                ssh "$@" < "$SSH_STDIN" && rc=0 || rc=$?
              else
                ssh "$@" && rc=0 || rc=$?
              fi
              if [ "$rc" -ne 255 ] || [ "$attempt" -ge "$max" ]; then
                return "$rc"
              fi
              sleep_s=$((attempt * 10))
              echo "ssh attempt $attempt failed (255), retrying in ${sleep_s}s..." >&2
              sleep "$sleep_s"
              attempt=$((attempt + 1))
            done
          }
          HELPER

      - name: Sync code
        timeout-minutes: 3
        env:
          SHA: ${{ github.sha }}
        run: |
          source ~/ssh_retry.sh
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA is not a valid git hash: $SHA"; exit 1; }
          ssh_retry vps "cd /opt/intelwatch && git fetch origin master && git reset --hard $SHA"
          ssh_retry vps "cd /opt/intelwatch && git log --oneline -1"

      - name: Stage deploy secrets
        timeout-minutes: 2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ENABLED: ${{ secrets.TI_AI_ENABLED }}
        run: |
          source ~/ssh_retry.sh
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/deploy.env"
          trap 'rm -f "$ENV_FILE"' EXIT
          umask 077
          printf 'GHCR_TOKEN=%s\nGHCR_OWNER=%s\nANTHROPIC_KEY=%s\nAI_ENABLED=%s\n' \
            "$GHCR_TOKEN" "$GHCR_OWNER" "$ANTHROPIC_KEY" "$AI_ENABLED" > "$ENV_FILE"
          SSH_STDIN="$ENV_FILE" ssh_retry vps 'umask 077; cat > /opt/intelwatch/.deploy.env'

      - name: Launch detached deploy
        timeout-minutes: 2
        env:
          SHA: ${{ github.sha }}
        run: |
          source ~/ssh_retry.sh
          set -euo pipefail
          LAUNCH_FILE="$RUNNER_TEMP/launch.sh"
          trap 'rm -f "$LAUNCH_FILE"' EXIT
          cat > "$LAUNCH_FILE" << 'LAUNCHER'
          set -euo pipefail
          SHA="$1"
          mkdir -p /var/log/etip-deploy
          STATUS_FILE="/var/log/etip-deploy/${SHA}.status"
          case "$(cat "$STATUS_FILE" 2>/dev/null)" in
            launched|running) echo "already launched"; exit 0 ;;
          esac
          echo "launched" > "$STATUS_FILE"
          setsid nohup bash /opt/intelwatch/scripts/deploy-vps.sh "$SHA" \
            > "/var/log/etip-deploy/${SHA}.log" 2>&1 < /dev/null &
          exit 0
          LAUNCHER
          SSH_STDIN="$LAUNCH_FILE" ssh_retry vps "bash -s -- '$SHA'"

      - name: Wait for deploy
        timeout-minutes: 14
        env:
          SHA: ${{ github.sha }}
        run: |
          source ~/ssh_retry.sh
          set -euo pipefail
          STATUS_FILE="/var/log/etip-deploy/${SHA}.status"
          LOG_FILE="/var/log/etip-deploy/${SHA}.log"
          elapsed=0
          max_elapsed=780
          fail_streak=0
          max_fail_streak=5
          launched_for=0
          status="unknown"
          while [ "$elapsed" -lt "$max_elapsed" ]; do
            if out=$(ssh_retry vps "cat '$STATUS_FILE' 2>/dev/null; true"); then
              fail_streak=0
              status=$(printf '%s' "$out" | tr -d '[:space:]')
            else
              fail_streak=$((fail_streak + 1))
              echo "poll failed ($fail_streak/$max_fail_streak), continuing..."
              if [ "$fail_streak" -ge "$max_fail_streak" ]; then
                echo "too many consecutive poll failures — giving up"
                ssh_retry vps "tail -n 200 '$LOG_FILE' 2>/dev/null || true" || true
                exit 1
              fi
              sleep 15
              elapsed=$((elapsed + 15))
              continue
            fi

            if [ "$status" = "ok" ]; then
              echo "✅ deploy ok"
              ssh_retry vps "tail -n 80 '$LOG_FILE'"
              exit 0
            elif [ "$status" = "fail" ]; then
              echo "❌ deploy failed"
              ssh_retry vps "tail -n 200 '$LOG_FILE'"
              exit 1
            elif [ "$status" = "launched" ]; then
              launched_for=$((launched_for + 15))
              if [ "$launched_for" -gt 120 ]; then
                echo "❌ deploy stuck at 'launched' for over 2 min — never took the lock"
                ssh_retry vps "tail -n 200 '$LOG_FILE' 2>/dev/null || true"
                exit 1
              fi
            fi

            if [ $((elapsed % 60)) -eq 0 ]; then
              echo "[$(date -u +%H:%M:%S)] status=${status}"
              ssh_retry vps "tail -n 3 '$LOG_FILE' 2>/dev/null || true" || true
            fi
            sleep 15
            elapsed=$((elapsed + 15))
          done
          echo "❌ deploy wait timed out after ${max_elapsed}s"
          ssh_retry vps "tail -n 200 '$LOG_FILE' 2>/dev/null || true" || true
          exit 1

      # ─── E2E Smoke Tests (master push only, non-blocking) ──────────
      - name: E2E pipeline smoke tests (post-deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source ~/ssh_retry.sh
          cat > "$RUNNER_TEMP/e2e.sh" << 'E2E_SCRIPT'
            set +e
            echo "═══ E2E Smoke Tests ═══"
            cd /opt/intelwatch

            # Guard: skip gracefully if pnpm not installed on VPS host
            if ! command -v pnpm &>/dev/null; then
              echo "⚠️  pnpm not found on VPS host — E2E tests skipped."
              echo "   Install Node 20 + pnpm on the host to enable post-deploy E2E."
              exit 0
            fi

            # Guard: skip if secrets not provided
            if [ -z "$E2E_ADMIN_EMAIL" ] || [ -z "$E2E_ADMIN_PASSWORD" ]; then
              echo "⚠️  E2E_ADMIN_EMAIL or E2E_ADMIN_PASSWORD not set — smoke tests skipped."
              echo "   Add these as GitHub repository secrets to enable E2E CI."
              exit 0
            fi

            E2E_ADMIN_EMAIL="$E2E_ADMIN_EMAIL" \
            E2E_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" \
            E2E_API_BASE="http://localhost:3001" \
            E2E_REDIS_URL="redis://localhost:6379" \
            pnpm vitest run tests/e2e/pipeline-smoke.test.ts \
              --config tests/e2e/vitest.config.ts \
              --reporter=verbose 2>&1 | tail -50 || true

            echo "═══ E2E complete (non-blocking) ═══"
            exit 0
          E2E_SCRIPT
          SSH_STDIN="$RUNNER_TEMP/e2e.sh" ssh_retry vps bash -s
